name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# GitHub only: the Forgejo runner also picks up .github/workflows when a repo has
# no .forgejo/workflows, and the hassfest/HACS actions do not run there.

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check custom_components/wanas_community/www/wanas-cards.js
      - run: npm test

  hassfest:
    name: Hassfest
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Custom repository: validate installable contents without requiring
          # the owner's issue tracker and topics for default-catalog inclusion.
          ignore: issues topics

  lint:
    name: Ruff
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check custom_components tests

  test:
    name: Pytest
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest pytest-homeassistant-custom-component "pymodbus>=3.10.0"
      - run: pytest tests/ -q --tb=short

